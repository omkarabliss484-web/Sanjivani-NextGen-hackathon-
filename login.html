<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Participant Login | Sanjivani NextGen Hackathon</title>

  <link rel="stylesheet" href="./main.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(99,102,241,0.18), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(6,182,212,0.14), transparent 30%),
        #050711;
      color: #f5f7ff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
      position: relative;
      overflow: hidden;
    }

    .login-page::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(99,102,241,0.10);
      filter: blur(90px);
      top: -180px;
      left: -150px;
    }

    .login-page::after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: rgba(6,182,212,0.08);
      filter: blur(90px);
      bottom: -180px;
      right: -130px;
    }

    .login-card {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 2;

      padding: 38px;
      border-radius: 26px;

      background: rgba(13, 17, 32, 0.88);
      border: 1px solid rgba(255,255,255,0.10);

      box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.05);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 38px;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;

      color: white;

      background:
        linear-gradient(135deg, #6366f1, #06b6d4);

      box-shadow:
        0 10px 30px rgba(99,102,241,0.30);
    }

    .login-brand h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }

    .login-brand p {
      font-size: 13px;
      color: #9299ae;
    }

    .login-heading {
      margin-bottom: 28px;
    }

    .login-heading span {
      display: inline-block;
      margin-bottom: 9px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;

      color: #818cf8;
    }

    .login-heading h2 {
      font-size: 32px;
      line-height: 1.15;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .login-heading p {
      color: #9299ae;
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 700;
      color: #dce1f0;
    }

    .field input {
      width: 100%;
      height: 52px;

      padding: 0 15px;

      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.10);

      outline: none;

      background: rgba(255,255,255,0.045);
      color: #ffffff;

      font-size: 14px;

      transition: 0.2s ease;
    }

    .field input::placeholder {
      color: #666d82;
    }

    .field input:focus {
      border-color: #6366f1;
      background: rgba(99,102,241,0.06);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.10);
    }

    .password-box {
      display: flex;
      gap: 9px;
    }

    .password-box input {
      flex: 1;
      min-width: 0;
    }

    .password-toggle {
      width: 70px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 13px;

      background: rgba(255,255,255,0.05);
      color: #cbd1e2;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;
      transition: 0.2s ease;
    }

    .password-toggle:hover {
      background: rgba(255,255,255,0.10);
      color: white;
    }

    .login-btn {
      width: 100%;
      height: 54px;

      margin-top: 5px;

      border: 0;
      border-radius: 14px;

      color: white;
      background: linear-gradient(135deg, #6366f1, #4f46e5);

      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;

      cursor: pointer;

      box-shadow:
        0 12px 30px rgba(79,70,229,0.25);

      transition: 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 16px 35px rgba(79,70,229,0.35);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .login-message {
      min-height: 22px;
      margin-top: 14px;

      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .login-message.error {
      color: #ff7b8a;
    }

    .login-message.success {
      color: #4ade80;
    }

    .login-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;

      margin-top: 22px;

      font-size: 13px;
      color: #626a80;
    }

    .login-links a,
    .back-home a {
      color: #a5b4fc;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .login-links a:hover,
    .back-home a:hover {
      color: #ffffff;
    }

    .back-home {
      text-align: center;
      margin-top: 24px;
      padding-top: 22px;

      border-top: 1px solid rgba(255,255,255,0.07);

      font-size: 13px;
    }

    @media (max-width: 520px) {

      .login-page {
        padding: 18px;
      }

      .login-card {
        padding: 28px 22px;
        border-radius: 22px;
      }

      .login-brand {
        margin-bottom: 30px;
      }

      .login-heading h2 {
        font-size: 28px;
      }

      .login-logo {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">

        <div class="login-logo">
          SN
        </div>

        <div>
          <h1>Sanjivani NextGen</h1>
          <p>Hackathon Participant Portal</p>
        </div>

      </div>


      <div class="login-heading">

        <span>WELCOME BACK</span>

        <h2>Participant Login</h2>

        <p>
          Login to continue to your hackathon dashboard.
        </p>

      </div>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-box">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
            >
              SHOW
            </button>

          </div>

        </div>


        <button
          type="submit"
          id="loginBtn"
          class="login-btn"
        >
          LOGIN TO DASHBOARD →
        </button>


        <div
          id="message"
          class="login-message"
        ></div>

      </form>


      <div class="login-links">

        <a
          href="#"
          id="forgotPassword"
        >
          Forgot password?
        </a>

        <span>•</span>

        <a href="./register.html">
          Create account
        </a>

      </div>


      <div class="back-home">

        <a href="./index.html">
          ← Back to Hackathon Home
        </a>

      </div>

    </section>

  </main>


<script>

const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");


/* ================= PASSWORD SHOW / HIDE ================= */

document
  .getElementById("togglePassword")
  .addEventListener("click", function () {

    const password =
      document.getElementById("password");

    if (password.type === "password") {

      password.type = "text";
      this.textContent = "HIDE";

    } else {

      password.type = "password";
      this.textContent = "SHOW";

    }

});


/* ================= LOGIN ================= */

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  message.textContent = "";
  message.className = "login-message";

  loginBtn.disabled = true;
  loginBtn.textContent = "SIGNING IN...";


  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,
        password: password

      });


    if (error) {
      throw error;
    }


    if (!data.session) {
      throw new Error(
        "Login session could not be created."
      );
    }


    /*
      Check profile role.
      Admin → admin.html
      Participant → dashboard.html
    */

    const {
      data: profile,
      error: profileError
    } = await supabaseClient

      .from("profiles")

      .select("role")

      .eq("id", data.user.id)

      .maybeSingle();


    if (profileError) {
      throw profileError;
    }


    if (
      profile &&
      profile.role === "admin"
    ) {

      window.location.href =
        "./admin.html";

    } else {

      window.location.href =
        "./dashboard.html";

    }


  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );


    message.textContent =
      error.message ||
      "Login failed. Please try again.";


    message.className =
      "login-message error";


    loginBtn.disabled = false;

    loginBtn.textContent =
      "LOGIN TO DASHBOARD →";

  }

});


/* ================= FORGOT PASSWORD ================= */

document
  .getElementById("forgotPassword")
  .addEventListener("click", async function(event) {

    event.preventDefault();


    const email =
      document.getElementById("email")
        .value
        .trim();


    if (!email) {

      message.textContent =
        "Enter your registered email first.";

      message.className =
        "login-message error";

      return;

    }


    try {

      const { error } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin +
                window.location.pathname
            }
          );


      if (error) {
        throw error;
      }


      message.textContent =
        "Password reset email sent. Check your inbox.";

      message.className =
        "login-message success";


    } catch (error) {

      console.error(
        "RESET ERROR:",
        error
      );


      message.textContent =
        error.message ||
        "Unable to send reset email.";

      message.className =
        "login-message error";

    }

});

</script>

</body>
</html>
